[package]
name = "penguin-pal"
version = "0.5.9"
description = "AI Desktop Pet Assistant"
authors = ["PenguinPal Team"]
edition = "2021"

[lib]
path = "src/companion_lib.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]

tauri = { version = "2.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-autostart = { version = "2.0" }
tauri-plugin-dialog = { version = "2.0" }
tauri-plugin-global-shortcut = { version = "2.0", optional = true }
tauri-plugin-shell = { version = "2.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.8", optional = true }
uuid = { version = "1.0", features = ["v4"] , optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
# === Whisper 语音识别依赖 ===
whisper-rs = { version = "0.12", optional = true }
cpal = { version = "0.15", optional = true }
ringbuf = { version = "0.4", optional = true }
parking_lot = { version = "0.12", optional = true }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", features = ["sync", "rt", "macros"] , optional = true }
rand = { version = "0.8", optional = true }
sha2 = { version = "0.10" }
chrono = { version = "0.4", features = ["clock", "serde"] , optional = true }


[features]
default = ["custom-protocol"]
legacy-assistant = ["dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-shell", "dep:toml", "dep:uuid", "dep:whisper-rs", "dep:cpal", "dep:ringbuf", "dep:parking_lot", "dep:futures-util", "dep:tokio", "dep:rand", "dep:chrono"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.10"
